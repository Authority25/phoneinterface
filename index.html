<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone-interface</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Inter:wght@500;600;700&display=swap rel=" stylesheet" />
</head>

<body>
  <div class="vldbtn"></div>
  <div class="vlupbtn"></div>
  <div class="phonebody">
    <div class="dynamicisland"></div>

    <!-- Lock Screen -->
    <div id="lockscreen" class="lockscreen">
      <div id="battertndnetwork" class="battertndnetwork"><h3 class="nservice">No Service</h3> <img class="cellularetc" src="img/cellular-removebg-preview.png" alt=""></div>
      <div class="datendtime">
        <p>Sat 18 oct</p>
        <h2>10:00</h2>
      </div>
      <div class="camerandlight">
        <div class="lockicon camera"></div>
        <div class="lockicon light"></div>
      </div>
      <div id="line" class="line"></div>

    </div>

    <!-- Home Screen -->
    <div id="homescreen" class="homescreen cutout">
      <div id="widget" class="widget cutout">
        <div class="wid wid1"></div>
        <div class="wid wid2"></div>
      </div>

      <div id="applications" class="applications cutout">
        <div class="app app1"></div>
        <div class="app app2"></div>
        <div class="app app3"></div>
        <div class="app app4"></div>
        <div class="app app5"></div>
        <div class="app app6 "></div>
        <div class="app app7 "></div>
        <div class="app app8 "></div>
        <div class="app app9 "></div>
        <div class="app app10"></div>
        <div class="app app11"></div>
        <div class="app app12"></div>
        <div class="app app13"></div>
        <div class="app app14"></div>
        <div class="app app15"></div>
        <div class="app app16"></div>
      </div>
            <div id="easynav" class="easynav cutout">
         <div class="app appnav1"></div>
        <div class="app appnav2"></div>
        <div class="app appnav3"></div>
        <div class="app appnav4"></div>
      </div>
    </div>
  </div>
  <div class="powebtn"></div>

  <script src="script.js"></script>
</body>

</html>
